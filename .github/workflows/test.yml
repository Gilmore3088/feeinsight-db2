name: test
on: [pull_request, push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.18' }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm test
      - run: npm run size
